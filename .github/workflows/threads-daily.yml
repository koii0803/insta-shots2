# 스레드 하루치 만들기 — 매일 06:30 KST (PC 꺼져 있어도 그날 스레드 글이 나가게, 2026-09-19).
# 작업/스레드하루치.py: 계획(3~5개) → 띠 글(파이썬) + 일상·사람 글(제미나이, Secrets GEMINI_API_KEY) → 쇼츠예약.json 에 넣고 커밋.
# 발행은 shorts-publish 가 30분마다. PC 새벽 루틴이 쇼츠와 같이 넣은 띠 글이 있으면 그만큼 안 만든다(04:30 루틴 뒤에 돌도록 06:30).
# 같은 날 두 번 안 만든다(스레드하루치기록.json). 깃허브가 cron 을 미루면 늦게 도는데, 시각 지난 자리는 건너뛴다.
name: threads-daily
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "만들 날짜 YYYY-MM-DD (비우면 오늘. 내일 것을 미리 만들 때)"
        required: false
        default: ""

concurrency:
  group: shorts-publish
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 하루치 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python 작업/스레드하루치.py ${{ inputs.day != '' && format('--day {0}', inputs.day) || '' }}
      - name: 예약표 커밋
        if: always()
        run: |
          git config user.name "threads-daily"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "스레드 하루치"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "푸시 실패, 다시 ($i/3)"; sleep 5
          done
          exit 1
