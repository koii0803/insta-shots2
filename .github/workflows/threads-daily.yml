# 스레드 하루치 만들기 — 매일 06:30 KST (PC 꺼져 있어도 그날 스레드 글이 나가게, 2026-09-19).
# 작업/스레드하루치.py: 계획(3~5개) → 띠 글(파이썬) + 일상·사람 글(클로드, Secrets CLAUDE_CODE_OAUTH_TOKEN) → R2 창고 예약표에 넣는다.
# 2026-09-25: 예약표·기록이 깃허브 파일에서 R2 창고(shorts/)로 갔다 → 커밋 없음. 발행은 shorts-publish 가 30분마다.
# 같은 날 두 번 안 만든다(창고 스레드하루치기록.json). 깃허브가 cron 을 미루면 늦게 도는데, 시각 지난 자리는 건너뛴다.
name: threads-daily
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "만들 날짜 YYYY-MM-DD (비우면 오늘. 내일 것을 미리 만들 때)"
        required: false
        default: ""

concurrency:
  group: shorts-publish
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pynacl boto3
      - name: 클로드 설치
        run: npm install -g @anthropic-ai/claude-code
      - name: 하루치 만들기
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python 작업/스레드하루치.py ${{ inputs.day != '' && format('--day {0}', inputs.day) || '' }}
