# 60일 토큰 자동 갱신 — 매주 월요일 03:00 KST(일요일 18:00 UTC). 사용자가 손댈 일 없음. PAT 없음.
# 금고(토큰.enc)를 Secrets 의 IG_ACCESS_TOKEN 으로 열어 60일 토큰을 새 60일로 연장하고 다시 잠가 커밋한다.
# 실패하면 금고는 그대로 두고 이 워크플로가 빨강 → 깃허브가 이메일로 알린다. 그때 PC 에서 python ig_token.py 로 금고를 다시 만든다.
name: token-refresh
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

concurrency:
  group: shorts-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pynacl
      - name: 60일 토큰 연장
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python 작업/토큰갱신.py
      - name: 금고 커밋
        if: always()
        run: |
          git config user.name "token-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "60일 토큰 갱신"
          # 예약표는 id 단위로 합친다(작업/예약표합치기.py, .gitattributes merge=queue) — 글자 충돌로 결과 커밋을 잃고 같은 영상이 또 올라가는 일 방지 (2026-09-22)
          git config merge.queue.driver "python 작업/예약표합치기.py %O %A %B"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "푸시 실패, 다시 ($i/3)"; sleep 5
          done
          exit 1
